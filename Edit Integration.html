<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opaque — Edit Integration</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="kit.css?v=24" />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="RegisterResource.jsx"></script>
<script type="text/babel" src="IntegrationEdit.jsx"></script>

<script type="text/babel">
const EDIT_VIEWS = [
  { key: "edit", n: 1, label: "Editing",
    note: <>Opening <strong>Edit configuration</strong> from the Registry row menu. The source is fixed (you can't re-point a Salesforce connection at Postgres), the saved secret is masked behind a <strong>Replace</strong> affordance, and a standing banner reminds you the connection is shared org-wide. Widening the ceiling — adding operations, unlocking a field — is always safe.</> },
  { key: "impact", n: 2, label: "Tightening change",
    note: <>The moment you <strong>remove an in-use operation</strong> or <strong>lock a builder-set field</strong>, the banner turns amber and the affected operation row flags exactly which workflows break. The save button becomes <strong>Review impact &amp; save</strong> — you can't quietly narrow a ceiling other people depend on.</> },
  { key: "confirm", n: 3, label: "Confirm &amp; save",
    note: <>Before a tightening save commits, a confirmation lists the precise changes and every affected workflow. Saving re-validates those workflows; a builder must adjust each before its agent runs again.</> },
];

function App() {
  const initial = (() => {
    try { return localStorage.getItem("opq-edit-view") || "edit"; } catch (e) { return "edit"; }
  })();
  const [view, setView] = React.useState(initial);
  const choose = (k) => {
    setView(k);
    try { localStorage.setItem("opq-edit-view", k); } catch (e) {}
  };
  const meta = EDIT_VIEWS.find((v) => v.key === view);

  return (
    <div className="gov-showcase">
      <div className="gov-showcase-bar">
        <div className="gov-brand">
          <span className="opq-logo"><OpaqueLogo width={74} /></span>
          <h1>Edit Integration</h1>
        </div>
        <div className="gov-seg">
          {EDIT_VIEWS.map((v) => (
            <button key={v.key} className={view === v.key ? "active" : ""} onClick={() => choose(v.key)}>
              <span className="gov-seg-num">{v.n}</span><span dangerouslySetInnerHTML={{ __html: v.label }} />
            </button>
          ))}
        </div>
      </div>

      <div className="gov-stage">
        <div className="gov-stage-inner">
          <p className="gov-stage-note">{meta.note}</p>
          <EditIntegrationModal key={view} embedded presetState={view} onClose={() => {}} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
